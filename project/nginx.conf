# ================================================================
#  futurebrts.com — Nginx Reverse Proxy Config
#  
#  Server par yeh file copy karo:
#  /etc/nginx/sites-available/futurebrts.com
#
#  Phir:
#  sudo ln -s /etc/nginx/sites-available/futurebrts.com /etc/nginx/sites-enabled/
#  sudo nginx -t
#  sudo systemctl reload nginx
# ================================================================

server {
    listen 80;
    server_name futurebrts.com www.futurebrts.com;

    # HTTP → HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name futurebrts.com www.futurebrts.com;

    # SSL certificates (Let's Encrypt / Certbot)
    ssl_certificate     /etc/letsencrypt/live/futurebrts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/futurebrts.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ─── Frontend (React build static files) ────────────────────
    root /var/www/futurebrts/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── API Gateway (Node.js port 7001) ────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── Socket.IO — WebSocket Support ──────────────────────────
    #  YAHAN PE DIKKAT THI: Bina Upgrade headers ke socket.io
    #  connection reject ho jaati thi. Quiz Battle button press
    #  karne par kuch nahi hota tha.
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;   # ← ZAROORI
        proxy_set_header   Connection "upgrade";        # ← ZAROORI
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;    # 1 hour — long-lived socket
        proxy_send_timeout 3600s;
    }

    # ─── Uploads / Downloads ────────────────────────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /downloads/ {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ─── File upload size limit ──────────────────────────────────
    client_max_body_size 50M;
}
